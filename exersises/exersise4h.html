<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
    <style>
      button{
        background-color: rgb(25, 135, 84);
        border: none;
        color: white;
        padding: 10px;
        margin-right:10px ;
      }
      .containerBtn{
        display: flex;
        height: 100vh;
        justify-content: center;
        align-items: center;
        background-color: rgb(222, 222, 222);
      }
    </style>
  </head>

  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev@8.6.4/external-library.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function App(){
          const[count , setCount] = React.useState(0);
          const btnRef = React.useRef();
          function reset(){
            setCount(0);
          }
          function click(){
                setCount(count + 1);
          }
          function autoClick(){
            const buttonElement = btnRef.current;
            setInterval(()=>{
                buttonElement.click();
            }, 1000)
          }
          return(
            <div className="containerBtn">
              <button onClick={click} ref={btnRef}>Clicked {count} {(count==1) ? "time" : "times"}</button>
              <button onClick={reset}>Reset</button>
              <button onClick={autoClick}>Auto Click</button>
            </div>
          );
        }
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App></App>);
    </script>
  </body>
</html>
