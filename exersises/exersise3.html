<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev@8.6.4/external-library.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function ButtonClick({count, setCount}){
            function click(){
                setCount(count + 1);
            }

            if(count == 1){
              return(
                <div>
                    <button onClick={click}>Clicked {count} time</button>
                </div>
              );
            }else{
              return(
                <div>
                    <button onClick={click}>Clicked {count} times</button>
                </div>
              );
            }   
        }
        function App(){
          const[count , setCount] = React.useState(0);
          function reset(){
            setCount(0);
          }
          return(
            <>
              <ButtonClick 
                count = {count}
                setCount ={setCount}
              />
              <ButtonClick 
                count = {count}
                setCount ={setCount}
              />
              <button onClick={reset}>Reset</button>
            </>
          );
        }
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App></App>);
    </script>
  </body>
</html>
