<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <style>
    button{
        
        border: none;
        color: white;
        padding: 7px;
        padding-left: 9px;
        padding-right: 9px;
        border-radius: 5px;
    }
    .onBtn{
        background-color: rgb(25, 135, 84);
    }
    .offBtn{
        background-color: rgb(220, 53, 69);
    }
  </style>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev@8.6.4/external-library.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function App(){
            const[isButtonOn, setIsButtonOn] = React.useState(true);
            function changeButton(){
                isButtonOn ? setIsButtonOn(false) : setIsButtonOn(true);
            }
            return(
                <div>
                    {
                        isButtonOn 
                            ? <button className="onBtn" onClick={changeButton}>ON</button> 
                            : <button className="offBtn" onClick={changeButton}>OFF</button>
                    }
                    
                </div>  
            )
        }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App></App>);
    </script>
  </body>
</html>
