<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev@8.6.4/external-library.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        function ProductDetails({item, price, discountPrice, imageSrc}){
            return(
               <div>
                    <img src={imageSrc} />
                    {item}
                    {discountPrice ? <del><p>Price: ${price}</p></del> : <p>Price: ${price}</p>}
                    
                    {   discountPrice &&
                        <p>Discount price :${discountPrice}</p>
                    }
                    
                    <button>Add to cart</button>
                </div> 
            );
        }
        function App(){
            return(
                <>
                <ProductDetails
                    item = "Cotton Socks"
                    price = "10.99"
                    discountPrice = "5.45"
                    imageSrc = "cotton-socks.png"
                />
                <ProductDetails
                    item = "Tennis balls"
                    price = "6.00"
                    imageSrc = "tennis-balls.png"
                />
                <ProductDetails
                    item = "Plain T-Shirt"
                    price = "7.99"
                    imageSrc = "plain-t-shirt.png"

                />
                </>
            );  
        }
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App></App>);
    </script>
  </body>
</html>
